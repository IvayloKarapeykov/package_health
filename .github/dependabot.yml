version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    target-branch: dev
    ignore:
      # Raising FastAPI's minimum past 0.141 would make Studio's requirements unsatisfiable (see
      # backend/requirements-studio.txt). Deploys install the newest FastAPI regardless.
      - dependency-name: fastapi
    groups:
      backend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      actions:
        patterns: ["*"]
